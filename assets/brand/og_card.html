<!doctype html>
<!-- THE LINK-PREVIEW CARD, 1200x630 (the 1.91:1 that wide previews use), one
     template for every card the site renders (2026-11-27, Reed: the wide banner
     cropped to "Only BOOS" in mynostr.app's square thumbnail). Everything that
     matters sits in the centre 600px, because some apps cut a square out of the
     middle for a thumbnail.

     Two layouts, chosen by the query string:
       og_card.html                      the generic card: the mark and the name
                                         large, the site's one-line description
       og_card.html?t=<title>&s=<sub>    a page's card: the mark and the name as
                                         a kicker, the title large, the sub under
     In `s`, a | is a line break. A title wider than the centre square shrinks
     until it fits. scripts/render-brand.sh renders every card. -->
<html><head><meta charset="utf-8"><style>
  @font-face{font-family:'Outfit';font-weight:100 900;src:url('../fonts/outfit.woff2') format('woff2')}
  html,body{margin:0;width:1200px;height:630px;background:#0b3a52;overflow:hidden}
  .col{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:'Outfit',sans-serif;color:#ffffff;text-align:center}
  .brand{display:flex;align-items:center;gap:18px}
  .brand img{width:88px;height:88px;display:block}
  .brand span{font-size:58px;font-weight:700;letter-spacing:-0.01em}
  b{color:#00aff0;font-weight:inherit}
  h1{margin:26px 0 0;font-size:104px;font-weight:800;line-height:1;letter-spacing:-0.02em;white-space:nowrap}
  .rule{width:84px;height:5px;border-radius:3px;background:#00aff0;margin:30px 0 26px}
  p{margin:0;font-size:31px;font-weight:500;line-height:1.3;color:rgba(255,255,255,0.82)}
  /* The generic card: the mark above the name, both large. */
  .generic .brand{flex-direction:column;gap:22px}
  .generic .brand img{width:168px;height:168px}
  .generic .brand span{font-size:100px;font-weight:800;letter-spacing:-0.02em;line-height:1}
  .generic h1{display:none}
</style></head><body><div class="col" id="col">
  <div class="brand"><img src="onlyboosts_mark_d5.svg" alt=""><span><b>Only</b>Boosts</span></div>
  <h1 id="t"></h1>
  <div class="rule"></div>
  <p id="s"></p>
</div><script>
  var q = new URLSearchParams(location.search);
  var t = q.get('t'), s = q.get('s') || 'Podcasts and Music,|Ranked by the Boosts Shared on Nostr';
  var col = document.getElementById('col'), h = document.getElementById('t'), p = document.getElementById('s');
  if (!t) col.className += ' generic'; else h.textContent = t;
  s.split('|').forEach(function (line, i) { if (i) p.appendChild(document.createElement('br')); p.appendChild(document.createTextNode(line)); });
  // A title wider than the centre square shrinks until it fits.
  // Measured once the font is in, or the fallback face's width decides it.
  if (t) document.fonts.ready.then(function () { var size = 104; while (h.scrollWidth > 600 && size > 56) { size -= 2; h.style.fontSize = size + 'px'; } });
</script></body></html>
